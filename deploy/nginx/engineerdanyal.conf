# HTTP-only bootstrap (Certbot will add SSL listen blocks)
# Install:
#   sudo cp deploy/nginx/engineerdanyal.conf /etc/nginx/sites-available/engineerdanyal
#   sudo ln -sf /etc/nginx/sites-available/engineerdanyal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then:
#   sudo certbot --nginx -d engineerdanyal.com -d www.engineerdanyal.com -d api.engineerdanyal.com

upstream portfolio_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream portfolio_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name engineerdanyal.com www.engineerdanyal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://portfolio_frontend;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.engineerdanyal.com;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://portfolio_backend;
    }
}
